<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirebrain Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Hirebrain</p>
    <h1>Synthetic CV factory feeding a LangGraph RAG agent</h1>

    <svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hirebrain-arch-title hirebrain-arch-desc">
      <title id="hirebrain-arch-title">Hirebrain RAG agent architecture</title>
      <desc id="hirebrain-arch-desc">An HR recruiter asks a screening question through a CLI, Chainlit, or API surface; cv_creator generates a synthetic PDF CV corpus indexed into Qdrant, and a LangGraph agent calls Ollama three separate times (route, rewrite, generate) around one retrieval call to Qdrant before answering.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONE: INTERFACES ============ -->
      <rect x="24" y="452" width="232" height="204" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="32" y="456" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="72" y="465" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INTERFACES</text>

      <!-- ============ ARROWS (drawn before nodes) ============ -->

      <!-- User -> CLI (asks a query) -->
      <line x1="144" y1="344" x2="144" y2="484" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="106" y="402" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="144" y="411" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASKS QUERY</text>

      <!-- cv_creator -> data/cvs (local write, internal) -->
      <line x1="240" y1="92" x2="280" y2="92" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- data/cvs -> Qdrant (HTTP index call) -->
      <path d="M440,92 H840" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="602" y="72" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="81" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXTRACT+INDEX</text>

      <!-- CLI -> Agent -->
      <path d="M240,506 H260 Q268,506 268,514 V527 Q268,535 276,535 H296"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Chainlit -> Agent -->
      <path d="M240,562 H260 Q268,562 268,566 V566 Q268,570 276,570 H296"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- API -> Agent -->
      <path d="M240,618 H260 Q268,618 268,610 V613 Q268,605 276,605 H296"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Agent -> Qdrant (retrieve, HTTP) -->
      <path d="M426,500 V208 Q426,200 434,200 H932 Q940,200 940,208 V124"
            fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="645" y="180" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="683" y="189" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRIEVE</text>

      <!-- Agent -> Ollama, call 1 of 3: route -->
      <path d="M556,554 H690 Q698,554 698,546 V532 Q698,524 706,524 H840"
            fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="584" y="534" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="543" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 ROUTE</text>

      <!-- Agent -> Ollama, call 2 of 3: rewrite -->
      <path d="M556,578 H690 Q698,578 698,570 V556 Q698,548 706,548 H840"
            fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="584" y="558" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="567" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 REWRITE</text>

      <!-- Agent -> Ollama, call 3 of 3: generate (streams the answer back) -->
      <path d="M556,602 H690 Q698,602 698,594 V580 Q698,572 706,572 H840"
            fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="584" y="582" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="591" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 GENERATE</text>

      <!-- ============ NODES ============ -->

      <!-- User (input) -->
      <rect x="64" y="280" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="280" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="288" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.60)" stroke-width="0.8"/>
      <text x="90" y="297" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="144" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HR Recruiter</text>
      <text x="144" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~100 cvs / posting</text>

      <!-- cv_creator (backend/step) -->
      <rect x="40" y="60" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="60" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="68" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="66" y="77" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
      <text x="140" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cv_creator</text>
      <text x="140" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">faker+llm+pdf</text>

      <!-- data/cvs (store) -->
      <rect x="280" y="60" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="60" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="288" y="68" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="306" y="77" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="360" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">data/cvs/</text>
      <text x="360" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">25 pdf corpus</text>

      <!-- Qdrant (store) -->
      <rect x="840" y="60" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="60" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="848" y="68" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="868" y="77" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="940" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qdrant</text>
      <text x="940" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dense + sparse</text>

      <!-- CLI -->
      <rect x="40" y="484" width="200" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="484" width="200" height="44" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="503" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cv-chat / cv-ask</text>
      <text x="140" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cli</text>

      <!-- Chainlit -->
      <rect x="40" y="540" width="200" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="540" width="200" height="44" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="559" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chainlit</text>
      <text x="140" y="574" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8000 streaming</text>

      <!-- API -->
      <rect x="40" y="596" width="200" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="596" width="200" height="44" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="615" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
      <text x="140" y="630" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">post /chat</text>

      <!-- Agent (focal) -->
      <rect x="296" y="500" width="260" height="140" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="500" width="260" height="140" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="304" y="508" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="322" y="517" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="426" y="546" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LangGraph Agent</text>
      <text x="426" y="566" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">router</text>
      <text x="426" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rewrite</text>
      <text x="426" y="594" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retrieve</text>
      <text x="426" y="608" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">generate</text>
      <text x="426" y="628" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">per-thread memory</text>

      <!-- Ollama (external) -->
      <rect x="840" y="500" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="500" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="848" y="508" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="862" y="517" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="940" y="568" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ollama</text>
      <text x="940" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">llama3.2 · local</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="676" x2="1040" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="180" cy="692" r="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="192" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CORE AGENT</text>

      <line x1="340" y1="692" x2="368" y2="692" stroke="#2e5aa8" stroke-width="1"/>
      <text x="376" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NETWORK CALL (HTTP)</text>

      <line x1="580" y1="692" x2="608" y2="692" stroke="#4f5d75" stroke-width="1"/>
      <text x="616" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">IN-PROCESS CALL</text>

    </svg>
  </div>
</body>
</html>
